<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çağrı Lift Asansör</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container" id="login-container">
        <h1>Çağrı Lift Asansör</h1>
        <input type="password" id="password" placeholder="Şifre">
        <button onclick="login()">Giriş Yap</button>
    </div>
    <div class="main-container" id="main-container" style="display: none;">
        <div class="sidebar">
            <div class="menu-icon" onclick="toggleMenu()">&#9776;</div>
            <div class="menu" id="menu" style="display: none;">
                <div onclick="showSection('bakimlar')">Bakımlar</div>
                <div onclick="showSection('montajlar')">Montajlar</div>
                <div onclick="showSection('revizyonlar')">Revizyonlar</div>
            </div>
        </div>
        <div class="content">
            <div id="bakimlar" class="section">
                <h2>Bakımlar</h2>
                <label>Bina İsmi</label><input type="text"><br>
                <label>Yönetici Adı Soyadı</label><input type="text"><br>
                <label>Telefon Numarası</label><input type="text"><br>
                <label>Kapı Şifresi</label><input type="text"><br>
                <label>Konum</label><input type="text"><br>
            </div>
            <div id="montajlar" class="section" style="display: none;">
                <h2>Montajlar</h2>
                <label>Bina İsmi</label><input type="text"><br>
                <label>İlçe</label><input type="text"><br>
                <label>Mahalle</label><input type="text"><br>
            </div>
            <div id="revizyonlar" class="section" style="display: none;">
                <h2>Revizyonlar</h2>
                <table>
                    <tr><th>Bina İsmi</th><th>Etiket Rengi</th><th>Malzemeler</th><th>Durum</th></tr>
                    <tr>
                        <td><input type="text"></td>
                        <td><input type="text"></td>
                        <td><input type="text"></td>
                        <td><input type="checkbox"> Yapıldı <input type="checkbox"> Yapılmadı</td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
